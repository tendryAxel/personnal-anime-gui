[project]
name = "anime-gui"
version = "0.1.0"
description = "My anime GUI application"
readme = "README.md"
authors = [
    { name = "tendryAxel", email = "hei.tendry@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "kitsu-py-extended>=1.0.4",
    "toga>=0.5.6",
]
license-files = ["LICENSE.md"]

[project.scripts]
anime-gui = "anime_gui:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.briefcase]
project_name = "Anime GUI"
bundle = "com.axel"
version = "0.1.0"
license = "MIT"

[tool.briefcase.app.anime_gui]
formal_name = "Anime GUI"
description = "My anime GUI application"
sources = ["src/anime_gui"]

[dependency-groups]
dev = [
    "briefcase>=0.4.4",
    "pytest>=9.1.1",
]
